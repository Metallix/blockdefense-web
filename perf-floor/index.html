<!doctype html><meta name=viewport content="width=device-width"><style>html,body{margin:0;height:100%}canvas{width:100%;height:100%;display:block}</style>
<canvas id=c></canvas><script>
const c=document.getElementById('c');c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;
const gl=c.getContext('webgl2');let f=0;
(function loop(){gl.clearColor((f++%60)/60,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);gl.drawArrays(gl.POINTS,0,0);requestAnimationFrame(loop)})();
</script>
