<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>BlockDefense</title>
    <script>
      // Debug aid, off unless the URL has ?log: copies console output to the serving host's
      // /__log, which docs/serve-webgl.ps1 -Log prints - a phone's console is otherwise out of reach.
      if (/[?&]log\b/.test(location.search)) (function () {
        function send(level, args) {
          try {
            var msg = Array.prototype.map.call(args, function (a) { return a && a.stack ? a.stack : String(a); }).join(" ");
            navigator.sendBeacon("__log", level + " " + msg.slice(0, 2000));
          } catch (e) {}
        }
        ["log", "info", "warn", "error"].forEach(function (k) {
          var orig = console[k];
          console[k] = function () { send(k, arguments); return orig.apply(console, arguments); };
        });
        window.addEventListener("error", function (e) { send("onerror", [e.message + " @ " + e.filename + ":" + e.lineno]); });
        window.addEventListener("unhandledrejection", function (e) { send("rejection", [e.reason]); });
        send("info", ["page start " + navigator.userAgent + " " + innerWidth + "x" + innerHeight + " dpr=" + devicePixelRatio]);
      })();
    </script>
    <!-- Full-bleed, app-like page: the canvas IS the page, edge to edge under notches and home indicators
         (viewport-fit=cover); the HUD keeps clear of them itself - BlockDefense.SafeArea reads
         env(safe-area-inset-*) through SafeArea.jslib. The apple/mobile meta tags make
         "Add to Home Screen" launch without browser chrome. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BlockDefense">
    <meta name="theme-color" content="#0b0f19">
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #0b0f19; color: #e6ecf5;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
        overscroll-behavior: none;        /* no pull-to-refresh / rubber-banding */
        touch-action: none;               /* no pinch/double-tap zoom or scroll gestures */
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      /* Sized in device pixels by Unity (matchWebGLToCanvasSize): the HUD and the camera framing
         (CameraFit) follow the real screen shape, portrait phones included. */
      #unity-canvas {
        position: fixed; inset: 0; display: block; outline: none;
        width: 100vw; height: 100vh; height: 100dvh;
        background: #0b0f19;
      }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        background: #0b0f19; z-index: 2; transition: opacity .3s;
      }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading h1 { margin: 0; font-size: 1.4rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
      #bar { width: min(60vw, 260px); height: 8px; border: 1px solid #e6ecf5; padding: 2px; box-sizing: content-box; }
      #bar-fill { width: 0; height: 100%; background: #e6ecf5; }
      #loading-note { font-size: .8rem; opacity: .6; }
      #error { display: none; max-width: 80vw; text-align: center; color: #ff8a80; font-size: .9rem; }
      #fullscreen {
        position: fixed;
        right: calc(10px + env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px));
        width: 36px; height: 36px; z-index: 1; display: none; opacity: .35; cursor: pointer;
        border: 1px solid #e6ecf5; border-radius: 6px; background: rgba(11,15,25,.6);
      }
      #fullscreen:hover { opacity: .9; }
      #fullscreen::before { content: ""; position: absolute; inset: 9px; border: 2px solid #e6ecf5; border-radius: 2px; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <h1>BlockDefense</h1>
      <div id="bar"><div id="bar-fill"></div></div>
      <div id="loading-note">Loading&hellip;</div>
      <div id="error"></div>
    </div>
    <button id="fullscreen" title="Fullscreen" aria-label="Fullscreen"></button>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data",
        frameworkUrl: buildUrl + "/WebGL.framework.js",
        codeUrl: buildUrl + "/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "BlockDefense",
        productVersion: "0.1.0",
        showBanner: function (msg, type) {
          if (type === "error") showError(msg);
          else console.warn("[Unity]", msg);
        },
      };

      // Phones have 3x screens; a full-resolution frame plus the post pass is a lot of fill for a
      // browser. Cap the backing-store scale there (desktop keeps the native ratio).
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent))
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      function showError(msg) {
        var e = document.querySelector("#error");
        e.textContent = msg; e.style.display = "block";
        document.querySelector("#loading").classList.remove("done");
        document.querySelector("#bar").style.display = "none";
        document.querySelector("#loading-note").style.display = "none";
      }

      // Right-click rotates the piece: don't pop the context menu over the canvas.
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      window.addEventListener("pointerdown", function () { canvas.focus(); });

      // iOS only gives a page device motion (the cards' holo foil follows the tilt - HoloTilt) after the
      // player allows it, and only asked from a tap. Ask once, on the first one; elsewhere it's just there.
      if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
        window.addEventListener("touchend", function askMotion() {
          window.removeEventListener("touchend", askMotion);
          DeviceMotionEvent.requestPermission().catch(function () {});
        });
      }

      var script = document.createElement("script");
      script.src = buildUrl + "/WebGL.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#bar-fill").style.width = (100 * progress) + "%";
        }).then(function (unity) {
          document.querySelector("#loading").classList.add("done");
          canvas.focus();
          // iPhone Safari has no element-fullscreen API; there the page is already as full as it gets
          // (use Add to Home Screen for the chrome-less app launch).
          if (document.fullscreenEnabled || document.webkitFullscreenEnabled) {
            var btn = document.querySelector("#fullscreen");
            btn.style.display = "block";
            btn.onclick = function () { unity.SetFullscreen(1); };
          }
        }).catch(function (message) { showError(String(message)); });
      };
      script.onerror = function () { showError("Could not load the game files."); };
      document.body.appendChild(script);
    </script>
  </body>
</html>
